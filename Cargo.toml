[package]
name = "smallweb-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal reader for Kagi Small Web"
license = "MIT"

[[bin]]
name = "smallweb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
crossterm = "0.29"
dom_smoothie = "0.20"
encoding_rs = "0.8"
opaline = { version = "0.4", features = ["widgets"] }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
